name: hercode
description: "A new Flutter project."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  material_symbols_icons: ^4.2960.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true
  assets:
    - assets/personagens/
    - assets/conquistas/desbloqueadas/
    - assets/conquistas/bloqueadas/
    - assets/hall_da_fama/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/hercode_icon.png"